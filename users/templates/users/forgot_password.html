{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'users/css/CombineDemocs.css' %}">
</head>
<body>
    <section class="forms-section">
        <img src="{% static 'users/images/wallpapaer2.jpg' %}" class="bg" alt="Background">
        <h1 class="section-title">Forgot Password</h1>
        <div class="forms">
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
            <div class="form-wrapper forgot-password-wrapper">
                <form class="form" method="post" action="{% url 'forgot_password' %}">
                    {% csrf_token %}
                    <fieldset>
                        <legend>Enter your email to reset your password</legend>
                        <div class="input-block">
                            <label for="email">Email</label>
                            <input id="email" type="email" name="email" required>
                        </div>
                    </fieldset>
                    <button type="submit" class="btn">Submit</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
