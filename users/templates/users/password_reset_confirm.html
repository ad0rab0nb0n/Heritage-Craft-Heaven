{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        /* General Styles */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
        }

        /* Background Image Styling */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
        }

        /* Form Section */
        .forms-section {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff; /* Solid white background */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Vertically center the form */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Section Title */
        .section-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            font-size: 14px;
            color: #ffffff;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        .form-control:focus {
            border-color: #2f373f;
            outline: none;
            box-shadow: 0 0 5px rgba(14, 15, 16, 0.5);
        }

        /* Button Styling */
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #1c1e21;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #14171a;
        }

        /* Additional Links */
        .additional-links {
            margin-top: 20px;
        }

        .login-link {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <section class="forms-section">
        <img src="{% static 'users/images/wallpapaer2.jpg' %}" class="bg" alt="Background">
        <h1 class="section-title">Reset Your Password</h1>
        <div class="forms">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="new_password1">New Password</label>
                    <input type="password" name="new_password1" class="form-control" id="new_password1" required>
                </div>
                <div class="form-group">
                    <label for="new_password2">Confirm New Password</label>
                    <input type="password" name="new_password2" class="form-control" id="new_password2" required>
                </div>
                <button type="submit" class="btn">Reset Password</button>
                <div class="additional-links">
                    <a href="{% url 'login' %}" color="black">Click here to login again</a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
