{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.8; /* Slight transparency for better contrast */
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url("{% static 'users/images/wallpaper2.jpg' %}"); /* Set your background image */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-wrapper {
            width: 600px;
            background-color: rgba(255, 255, 255, 0.9); /* White background with slight transparency */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .form-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 70%;
            height: 100%;
            background-image: url("{% static 'users/images/silver_bowl.jpg' %}"); /* Image beside form */
            background-size: cover;
            background-position: center;
            z-index: -1;
            border-radius: 10px 0 0 10px;
        }

        .form-heading {
            font-size: 24px;
            color: #1e3348;
            text-align: center;
            margin-bottom: 20px;
        }

        fieldset {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;

        }

        .input-block {
            width: 48%; /* Two columns with spacing */
            margin-bottom: 15px;
            margin-right: 15px;
        }

        .input-block label {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            display: block;

        }

        .input-block input, .input-block textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .btn-signup {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #16212d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-signup:hover {
            background-color: #0e1b29;
        }

        .additional-links {
            text-align: center;
            margin-top: 10px;
        }

        .additional-links a {
            text-decoration: none;
            color: #16212d;
        }

        /* Media query for responsiveness */
        @media (max-width: 768px) {
            .form-wrapper {
                width: 90%;
            }

            .input-block {
                width: 100%;
            }

            .form-wrapper::before {
                display: none; /* Hide side image on smaller screens */
            }
        }
        .input-block {
            width: 48%; /* Two columns with spacing */
            margin-bottom: 15px;
            margin-right: 15px; /* Space between columns */
        }

        /* To remove right margin for the last column on each row */
        .input-block:nth-child(2n) {
            margin-right: 5px;
        }

    </style>
</head>
<body>
    <img src="{% static 'users/images/wallpapaer2.jpg' %}" class="bg" alt="Background">

    <div class="form-wrapper">

        <h2 class="form-heading">SIGN UP</h2>
        <form method="post" action="{% url 'signup' %}">
            {% csrf_token %}
            <fieldset>
                <div class="input-block">
                    <label for="signup-username">Username</label>
                    <input id="signup-username" type="text" name="username" required>
                </div>
                <div class="input-block">
                    <label for="signup-email">E-mail</label>
                    <input id="signup-email" type="email" name="email" required>
                </div>
                <div class="input-block">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" type="password" name="password" required>
                </div>
                <div class="input-block">
                    <label for="signup-password-confirm">Confirm Password</label>
                    <input id="signup-password-confirm" type="password" name="password_confirm" required>
                </div>
                <div class="input-block">
                    <label for="signup-phone">Phone Number</label>
                    <input id="signup-phone" type="text" name="phone_number">
                </div>
                <div class="input-block">
                    <label for="signup-address">Address</label>
                    <textarea id="signup-address" name="address"></textarea>
                </div>
            </fieldset>
            <button type="submit" class="btn-signup">Sign Up</button>
            <div class="additional-links">
                <a href="{% url 'login' %}">Already have an account? Login</a>
            </div>
        </form>
    </div>

</body>
</html>
